; HearMeOut – nastavenie efektov mikrofónu
; Súbor: C:\ProgramData\HearMeOut\config.ini
; Zmeny sa prejavia do ~0,3 s po uložení, bez reštartu (APO súbor sleduje).

[global]
bypass = 0              ; 1 = úplne vypnúť spracovanie
input_channel = 0       ; kanál s mikrofónom (0 = Input 1, 1 = Input 2, -1 = priemer všetkých)
input_gain_db = 0
output_gain_db = 0

[highpass]
enabled = 1
freq = 90               ; Hz – pod tým je len dunenie, hukot a buchnutia do stola

[denoise]
enabled = 1
reduction_db = 24       ; max. potlačenie šumu (12 jemné, 24 bežné, 35 agresívne)
strength = 1.6          ; 1.0 = zachová viac hlasu, 3.0 = vyčistí viac (riziko „robotického“ zvuku)

[gate]
enabled = 1
threshold_db = -50      ; pod týmto sa stlmuje (zisti z peak_in_db v status.ini, keď mlčíš)
ratio = 2.5
range_db = 18           ; o koľko max. stlmiť – nie úplné ticho, znie prirodzenejšie
attack_ms = 1
hold_ms = 80
release_ms = 120

[eq]
enabled = 1
low_freq = 120          ; low shelf – telo hlasu
low_gain_db = 2
mud_freq = 320          ; „krabicový“ zvuk lacných mikrofónov
mud_gain_db = -2.5
mud_q = 1.0
presence_freq = 3500    ; zrozumiteľnosť
presence_gain_db = 2.5
presence_q = 0.9
air_freq = 10000        ; high shelf – vzduch, „drahý“ zvuk
air_gain_db = 2

[compressor]
enabled = 1
mode = 2                ; 0 = Opto (jemný), 1 = FET (rádio), 2 = Opto + FET (úderný)
threshold_db = -25
ratio = 3.6
knee_db = 6
attack_ms = 6
release_ms = 110
auto_makeup = 1         ; automaticky vráti hlasitosť
makeup_db = 0           ; + ručná korekcia

[saturation]
enabled = 1
drive = 40              ; „farba“ 0–100

[deesser]
enabled = 1
freq = 6500             ; sykavky od tejto frekvencie
threshold_db = -30
range_db = 8

[fun]
; zábavné hlasové efekty: 0 vypnuté, 1 chipmunk, 2 monštrum, 3 robot, 4 vysielačka, 5 telefón, 6 megafón, 7 jaskyňa, 8 mimozemšťan
type = 0
amount = 50
mix = 100

[limiter]
enabled = 1
ceiling_db = -1         ; nikdy neprekročí – ochrana proti clipu pri smiechu/kriku
release_ms = 60
